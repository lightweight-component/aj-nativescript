plugins {
    id 'java-library'
    id 'maven-publish'
}

group = providers.gradleProperty('group').get()
version = providers.gradleProperty('version').get()

base {
    archivesName = 'aj-nativescript'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.docEncoding = 'UTF-8'
}

// Compile against Android APIs without packaging SDK classes into the library JAR.
def sdkProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { sdkProperties.load(it) }
}
/*
 * Environment overrides machine-local SDK paths for cross-platform builds.
 */
def sdkDirectory = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT') ?:
        sdkProperties.getProperty('sdk.dir')
def compileSdkVersion = providers.gradleProperty('androidCompileSdk').getOrElse('35')
if (!sdkDirectory) {
    throw new GradleException('Set sdk.dir in android/nativescipt-common/local.properties or set ANDROID_HOME to your Android SDK directory.')
}
def androidApiJar = new File(sdkDirectory, "platforms/android-${compileSdkVersion}/android.jar")
if (!androidApiJar.isFile()) {
    throw new GradleException("Android SDK platform ${compileSdkVersion} is missing: ${androidApiJar}. Install it in SDK Manager or set -PandroidCompileSdk=<installed API level>.")
}

dependencies {
    compileOnly files(androidApiJar)
    testCompileOnly files(androidApiJar)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
}

tasks.named('test') {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'aj-nativescript'
        }
    }
}
